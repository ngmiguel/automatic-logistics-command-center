name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TESTING: "true"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  JWT_SECRET_KEY: test-secret
  SECRET_KEY: test-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src/ tests/

  test-modules:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - auth
          - fleet
          - routing
          - tracking
          - notification
          - analytics
          - simulator
          - worker
          - integration
    name: test-${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: python scripts/tests/run_module.py ${{ matrix.module }}

  test-coverage:
    runs-on: ubuntu-latest
    needs: test-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: python scripts/tests/run_module.py all --cov
