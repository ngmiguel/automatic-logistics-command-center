name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTING: "true"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  JWT_SECRET_KEY: test-secret
  SECRET_KEY: test-secret
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Change detection (skip unrelated jobs on doc-only commits) ──────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'Dockerfile.worker'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            docker:
              - 'docker-compose.yml'
              - 'Dockerfile'
              - 'Dockerfile.worker'
              - 'frontend/Dockerfile'
              - 'mobile/Dockerfile'
              - '.dockerignore'
              - 'frontend/.dockerignore'
              - 'mobile/.dockerignore'

  # ── Backend ───────────────────────────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true'
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src/ tests/

  backend-test-modules:
    runs-on: ubuntu-latest
    needs: [changes, backend-lint]
    if: >-
      needs.changes.outputs.backend == 'true'
      || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - auth
          - fleet
          - routing
          - tracking
          - notification
          - analytics
          - simulator
          - worker
          - integration
    name: test-${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: python scripts/tests/run_module.py ${{ matrix.module }}

  backend-coverage:
    runs-on: ubuntu-latest
    needs: [changes, backend-test-modules]
    if: >-
      needs.changes.outputs.backend == 'true'
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: python -m pytest tests/ -v --tb=short --cov=alcc --cov-report=term-missing --cov-report=html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  # ── Frontend (React / Vite) ───────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Mobile (Expo / React Native) ────────────────────────────────────────
  mobile:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true'
      || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  # ── Docker ──────────────────────────────────────────────────────────────
  docker-validate:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.docker == 'true'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.mobile == 'true'
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, docker-validate, frontend, mobile]
    if: >-
      always()
      && needs.docker-validate.result == 'success'
      && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
      && (needs.mobile.result == 'success' || needs.mobile.result == 'skipped')
      && (
        needs.changes.outputs.docker == 'true'
        || needs.changes.outputs.backend == 'true'
        || needs.changes.outputs.frontend == 'true'
        || needs.changes.outputs.mobile == 'true'
        || github.event_name == 'pull_request'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: worker
            context: .
            dockerfile: Dockerfile.worker
          - name: frontend
            context: frontend
            dockerfile: Dockerfile
          - name: mobile
            context: mobile
            dockerfile: Dockerfile
    name: docker-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context == '.' && matrix.dockerfile || format('{0}/{1}', matrix.context, matrix.dockerfile) }}
          push: false
          tags: alcc/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack-smoke:
    runs-on: ubuntu-latest
    needs: [changes, docker-build]
    if: >-
      always()
      && needs.docker-build.result == 'success'
      && (
        needs.changes.outputs.docker == 'true'
        || needs.changes.outputs.backend == 'true'
        || github.event_name == 'pull_request'
      )
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build stack images
        run: docker compose build postgres redis seed api
      - name: Start infrastructure
        run: docker compose up -d postgres redis
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U alcc -d alcc_db && exit 0
            sleep 2
          done
          exit 1
      - name: Seed demo users
        run: docker compose run --rm seed
      - name: Start API and wait for health
        run: |
          docker compose up -d api
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 3
          done
          docker compose logs api
          exit 1
      - name: Verify public analytics endpoint
        run: curl -sf http://localhost:8000/api/v1/analytics/public/summary | grep -q fleet
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ── Gate ────────────────────────────────────────────────────────────────
  ci-success:
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-lint
      - backend-test-modules
      - backend-coverage
      - frontend
      - mobile
      - docker-validate
      - docker-build
      - stack-smoke
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          check() {
            result="$1"
            name="$2"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "FAILED: $name ($result)"
              exit 1
            fi
            echo "OK: $name (${result:-skipped})"
          }
          check "${{ needs.backend-lint.result }}" "backend-lint"
          check "${{ needs.backend-test-modules.result }}" "backend-test-modules"
          check "${{ needs.backend-coverage.result }}" "backend-coverage"
          check "${{ needs.frontend.result }}" "frontend"
          check "${{ needs.mobile.result }}" "mobile"
          check "${{ needs.docker-validate.result }}" "docker-validate"
          check "${{ needs.docker-build.result }}" "docker-build"
          check "${{ needs.stack-smoke.result }}" "stack-smoke"
          echo "All CI checks passed."
